<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events – Northern Region Tennis Junior Council</title>
  <meta name="description" content="Upcoming events and community days.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>try{if(sessionStorage.getItem("nrtjc-wipe"))document.documentElement.classList.add("wiping")}catch(e){}</script>
</head>
<body data-page="events">
<header class="page-hero"><div class="wrap">
  <p class="eyebrow">Calendar</p>
  <h1>Upcoming events.</h1>
  <p>Tournaments, community days and fundraisers that bring the tennis community together.</p>
</div></header>
<div class="marquee" aria-hidden="true" data-words="Warm-up,First serve,Second serve,Tiebreak,Changeover,Final set"><div class="mq-track"></div></div>

<main>
  <section class="section">
    <div class="wrap">
      <ul class="events" id="eventList"></ul>
      <div class="empty-state reveal" id="eventsEmpty" hidden>
        <div class="ico">🎾</div>
        <h3>No events are scheduled right now</h3>
        <p>New events will be listed here as soon as they are confirmed. Please check back soon.</p>
        <a href="get-involved.html" class="btn btn-navy">Get involved</a>
      </div>
    </div>
  </section>
<div class="net" aria-hidden="true"><i></i></div>
</main>

<script src="site-config.js"></script>
<script src="events.js"></script>
<script src="events-page.js"></script>
<script src="layout.js"></script>
<script src="fun.js"></script>
<script src="play.js"></script>
<script src="play2.js"></script>
</body>
</html>
